<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movimentações</title>

    <link rel="stylesheet" href="/css/movimentacoes.css">
</head>

<body>

    <header>
        <h1>Movimentações</h1>
    </header>

    <main>

        <section class="resumo">
            <div class="card">
                <h3>Entradas</h3>
                <p>R$ 0,00</p>
            </div>

            <div class="card">
                <h3>Saídas</h3>
                <p>R$ 0,00</p>
            </div>

            <div class="card">
                <h3>Saldo</h3>
                <p>R$ 0,00</p>
            </div>
        </section>

        <section class="movimentacoes">

            <div class="cabecalho">
                <h2>Minhas movimentações</h2>

                <button>+ Nova movimentação</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Descrição</th>
                        <th>Categoria</th>
                        <th>Data</th>
                        <th>Tipo</th>
                        <th>Valor</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>Salário</td>
                        <td>Renda</td>
                        <td>01/10/2026</td>
                        <td>Entrada</td>
                        <td>R$ 1.621,00</td>
                    </tr>

                    <tr>
                        <td>Internet</td>
                        <td>Contas</td>
                        <td>05/10/2026</td>
                        <td>Saída</td>
                        <td>R$ 100,00</td>
                    </tr>
                </tbody>
            </table>

        </section>

    </main>

</body>
</html>
