<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" th:href="@{/img/logo-resgate-de-vidas.png}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Histórico de movimentações | Gestão Financeira</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/historico.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <script defer th:src="@{/js/app.js}"></script>
</head>
<body class="historico-pagina">
    <div class="layout">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <main class="main">
            <header class="page-head">
                <div>
                    <a th:href="@{/movimentacoes}" class="back-link">← Voltar</a>
                    <h1>Histórico de movimentações</h1>
                    <p>Consulte as movimentações por mês</p>
                </div>
            </header>

            <form class="period" method="get" th:action="@{/movimentacoes/historico}">
                <label for="periodo">Período selecionado</label>
                <select id="periodo" name="periodo" onchange="this.form.requestSubmit()">
                    <option th:each="p : ${periodos}"
                            th:value="${p}"
                            th:selected="${p.equals(mes)}"
                            th:text="${#temporals.format(p.atDay(1), 'MMMM yyyy')}">
                    </option>
                </select>
                <p>
                    Disponíveis: três meses anteriores, mês atual e três meses à frente.
                    Para outros períodos, consulte o
                    <a th:href="@{/relatorios}">relatório completo</a>.
                </p>
            </form>

            <div class="search">
                <span aria-hidden="true">⌕</span>
                <input id="search" type="search"
                       placeholder="Buscar neste mês" aria-label="Buscar neste mês">
            </div>

            <div class="tabs">
                <button type="button" class="selected" data-filter="TODAS">Todas</button>
                <button type="button" data-filter="ENTRADA">Entradas</button>
                <button type="button" data-filter="SAIDA">Saídas</button>
            </div>

            <section class="history">
                <div class="history-head">
                    <h2>Movimentações do período</h2>
                </div>

                <div class="items" id="items">
                    <article class="item" th:each="m : ${lista}"
                             th:attr="data-tipo=${m.tipo},data-descricao=${m.descricao}">
                        <div class="item-icon"
                             th:classappend="${m.tipo == 'ENTRADA' ? 'green' : 'red'}"
                             th:text="${m.tipo == 'ENTRADA' ? '↑' : '↓'}">↑</div>

                        <div class="item-info">
                            <strong th:text="${m.descricao}">Descrição</strong>
                            <small>
                                <span th:text="${#temporals.format(m.data, 'dd/MM/yyyy')}">Data</span>
                                · <span th:text="${m.statusPagamento}">PAGO</span>
                            </small>
                        </div>

                        <b class="amount"
                           th:classappend="${m.tipo == 'ENTRADA' ? 'positive' : 'negative'}"
                           th:text="${(m.tipo == 'ENTRADA' ? '+ ' : '- ') + 'R$ ' + #numbers.formatDecimal(m.valor, 1, 'POINT', 2, 'COMMA')}">
                            R$ 0,00
                        </b>
                    </article>

                    <p class="empty" th:if="${#lists.isEmpty(lista)}">
                        Nenhuma movimentação neste período.
                    </p>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
