<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" th:href="@{/img/logo-resgate-de-vidas.png}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Calendário | Resgate de Vidas</title>
    <meta name="description" content="Calendário financeiro da ONG Resgate de Vidas para acompanhar vencimentos, recebimentos e anotações. Acesso restrito aos usuários autorizados.">
    <meta name="financeiro-api" th:content="@{/api/financeiro}">
    <meta name="csrf-token" th:content="${_csrf.token}">
    <meta name="csrf-header" th:content="${_csrf.headerName}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/calendario.css}">
    <script th:src="@{/js/calendario-store.js}" defer></script>
    <script th:src="@{/js/calendario-ui.js}" defer></script>
    <script th:src="@{/js/calendario.js}" defer></script>
</head>
<body class="calendario-pagina">
<a class="pular-conteudo" href="#conteudo-principal">Ir para o conteúdo</a>
<div class="layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="main calendario-main" id="conteudo-principal" tabindex="-1">
        <header class="topo">
            <div class="topo-texto">
                <p class="sobretitulo">Resgate de Vidas</p>
                <h1>Calendário</h1>
                <p class="subtitulo">Contas, recebimentos e anotações</p>
            </div>
            <div class="topo-acoes">
                <button class="sino" type="button" id="btnAvisos" aria-label="Avisos de vencimento"><svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 9a6 6 0 1 1 12 0c0 6 2 7.5 2 7.5H4S6 15 6 9zm4 10a2 2 0 0 0 4 0"/></svg></button>
            </div>
        </header>

        <div class="cal-layout">
            <section class="cal-principal" aria-label="Calendário do mês">
                <div class="mes-barra">
                    <div class="mes-nav">
                        <button class="icone-btn" type="button" id="mesAnt" aria-label="Mês anterior"><svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7"/></svg></button>
                        <h2 class="mes-nome" id="mesNome" aria-live="polite"></h2>
                        <button class="icone-btn" type="button" id="mesProx" aria-label="Próximo mês"><svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 5l7 7-7 7"/></svg></button>
                    </div>
                    <button class="btn btn-pequeno" type="button" id="irHoje">Hoje</button>
                </div>

                <dl class="stats" id="stats"></dl>

                <div class="categorias-navegacao" aria-label="Navegar pelos filtros de categoria">
                    <button type="button" class="categorias-seta" id="catsEsquerda" aria-label="Mostrar categorias anteriores" title="Categorias anteriores">&#8249;</button>
                    <div class="chips" id="filtroCats" role="group" aria-label="Filtrar por categoria" tabindex="0"></div>
                    <button type="button" class="categorias-seta" id="catsDireita" aria-label="Mostrar próximas categorias" title="Próximas categorias">&#8250;</button>
                </div>

                <div class="grade-cx">
                    <div class="grade-semana" aria-hidden="true">
                        <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
                    </div>
                    <div class="grade" id="grade"></div>
                </div>

                <ul class="legenda" aria-label="Legenda">
                    <li><i class="ponto"></i> Efetivado</li>
                    <li><i class="ponto pend"></i> Previsto</li>
                    <li><i class="ponto nota"></i> Anotação</li>
                    <li><svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg> Recorrente</li>
                </ul>
            </section>

            <section class="dia-painel" aria-labelledby="diaTitulo">
                <div class="dia-cab">
                    <div>
                        <h2 id="diaTitulo"></h2>
                        <p class="subtitulo" id="diaSub"></p>
                    </div>
                    <button class="btn btn-pequeno" type="button" id="lancarConta"><svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg> Lançar conta</button>
                </div>

                <p id="lembretePublicacao" class="nota-item" hidden>
                    <a th:href="@{/relatorios}" id="linkRelatorioMensal">Publicar relatório no Portal da Transparência</a>
                </p>

                <form class="rapido" id="rapido">
                    <label class="sr-only" for="notaTexto">Nova anotação para este dia</label>
                    <input type="text" id="notaTexto" maxlength="255" placeholder="Anotar algo neste dia" autocomplete="off" enterkeyhint="done">
                    <label class="sr-only" for="notaCat">Categoria da anotação</label>
                    <select id="notaCat"></select>
                    <button class="btn btn-primario" type="submit">Anotar</button>
                </form>

                <ul class="itens-dia" id="itensDia" aria-live="polite"></ul>
                <p class="vazio" id="vazioDia" hidden><strong>Nada neste dia</strong>Escreva uma anotação acima ou lance uma conta.</p>
            </section>
        </div>
        <button class="fab" type="button" id="btnAnotar" aria-label="Anotar algo neste dia"><svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg></button>
    </main>
</div>
</body>
</html>
