<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

<aside class="barra-lateral" th:fragment="sidebar">
    <a class="marca" th:href="@{/dashboard}"
       aria-label="Resgate de Vidas – Criança Feliz, início">
        <img th:src="@{/img/logo-resgate-de-vidas.png}" alt="" width="64" height="64">
        <span class="marca-texto">
            <strong>Resgate de Vidas</strong>
            <span>Criança Feliz</span>
        </span>
    </a>

    <p class="marca-sistema">Gestão financeira</p>

    <nav class="navegacao" aria-label="Navegação principal">
        <p class="navegacao-titulo">Principal</p>

        <ul class="navegacao-lista">
            <li>
                <a class="navegacao-link" th:href="@{/dashboard}"
                   th:attr="aria-current=${paginaAtiva == 'dashboard' ? 'page' : null}">
                    <svg class="icone" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="1.6"
                         stroke-linecap="round" stroke-linejoin="round"
                         aria-hidden="true" focusable="false">
                        <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>
                    </svg>
                    <span>Início</span>
                </a>
            </li>

            <li>
                <a class="navegacao-link" th:href="@{/movimentacoes}"
                   th:attr="aria-current=${paginaAtiva == 'movimentacoes' ? 'page' : null}">
                    <svg class="icone" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="1.6"
                         stroke-linecap="round" stroke-linejoin="round"
                         aria-hidden="true" focusable="false">
                        <path d="M4 7h16m-4-4 4 4-4 4M20 17H4m4-4-4 4 4 4"/>
                    </svg>
                    <span>Movimentações</span>
                </a>
            </li>

            <li>
                <a class="navegacao-link" th:href="@{/calendario}"
                   th:attr="aria-current=${paginaAtiva == 'calendario' ? 'page' : null}">
                    <svg class="icone" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="1.6"
                         stroke-linecap="round" stroke-linejoin="round"
                         aria-hidden="true" focusable="false">
                        <rect x="3" y="5" width="18" height="16" rx="2"/>
                        <path d="M16 3v4M8 3v4M3 10h18"/>
                    </svg>
                    <span>Calendário</span>
                </a>
            </li>

            <li>
                <a class="navegacao-link" th:href="@{/relatorios}"
                   th:attr="aria-current=${paginaAtiva == 'relatorios' ? 'page' : null}">
                    <svg class="icone" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="1.6"
                         stroke-linecap="round" stroke-linejoin="round"
                         aria-hidden="true" focusable="false">
                        <path d="M6 3h9l4 4v14H6zM14 3v5h5M10 17v-3m4 3v-6"/>
                    </svg>
                    <span>Relatórios</span>
                </a>
            </li>

            <li>
                <a class="navegacao-link" th:href="@{/configuracoes}"
                   th:attr="aria-current=${paginaAtiva == 'configuracoes' ? 'page' : null}">
                    <svg class="icone" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="1.6"
                         stroke-linecap="round" stroke-linejoin="round"
                         aria-hidden="true" focusable="false">
                        <path d="M4 21V7l8-4 8 4v14M2 21h20M9 21v-5h6v5M8 9h1m6 0h1M8 12h1m6 0h1"/>
                    </svg>
                    <span>Dados da ONG</span>
                </a>
            </li>
        </ul>
    </nav>
</aside>

</body>
</html>
